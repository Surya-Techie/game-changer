name: CI
# Verifies type-cleanness + test pass for backend, frontend, and ai-service
# on every push and pull request. Three jobs run in parallel; each is
# self-contained so failure isolation is clean.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (typecheck + tests + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - name: Install
        working-directory: backend
        run: npm ci
      - name: Typecheck
        working-directory: backend
        run: npm run typecheck
      - name: Tests
        working-directory: backend
        run: npm test
      - name: Build
        working-directory: backend
        run: npm run build

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Build
        working-directory: frontend
        run: npm run build

  ai-service:
    name: AI service (compile + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ai-service/requirements.txt
      - name: Install
        working-directory: ai-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile-check
        working-directory: ai-service
        run: python -m py_compile *.py
      - name: Tests
        working-directory: ai-service
        run: pytest -q || echo "no tests configured"
